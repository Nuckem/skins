<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skins Gallery — Fast Minecraft Skins</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#111827;
    --card-hover:#151f30;
    --accent:#3b82f6;
    --accent-2:#60a5fa;
    --text:#e5e7eb;
    --text-dim:#94a3b8;
    --border:rgba(255,255,255,0.06);
    --shadow:0 10px 30px rgba(0,0,0,0.45);
    --radius:16px;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    background:
      radial-gradient(circle at 20% 0%, rgba(59,130,246,0.12), transparent 40%),
      radial-gradient(circle at 80% 10%, rgba(96,165,250,0.08), transparent 35%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI', Roboto, -apple-system, BlinkMacSystemFont, sans-serif;
    min-height:100vh;
  }

  ::selection{background:var(--accent); color:#fff;}

  /* ---------- Scrollbar ---------- */
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#1e293b;border-radius:10px;}
  ::-webkit-scrollbar-thumb:hover{background:#293548;}

  /* ---------- Header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:50;
    padding:22px 32px 16px;
    background:rgba(15,23,42,0.75);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }

  .header-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
    max-width:1400px;
    margin:0 auto;
  }

  .logo{
    display:flex;
    align-items:center;
    gap:12px;
    font-weight:800;
    font-size:22px;
    letter-spacing:0.3px;
  }

  .logo .cube{
    width:34px;
    height:34px;
    border-radius:9px;
    background:linear-gradient(135deg, var(--accent), #8b5cf6);
    box-shadow:0 4px 14px rgba(59,130,246,0.5);
  }

  .logo span.sub{
    color:var(--text-dim);
    font-weight:500;
    font-size:13px;
    margin-left:4px;
  }

  .controls-group {
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }

  .search-wrap{
    position:relative;
    width:280px;
  }

  .search-wrap input{
    width:100%;
    padding:12px 16px 12px 42px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#0b1220;
    color:var(--text);
    font-size:14px;
    outline:none;
    transition:border-color .2s, box-shadow .2s;
  }

  .search-wrap input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(59,130,246,0.25);
  }

  .search-wrap svg{
    position:absolute;
    left:14px;
    top:50%;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    stroke:var(--text-dim);
  }

  /* ---------- Переключатель сетки (Layout Controls) ---------- */
  .layout-switcher {
    display:flex;
    background:rgba(0,0,0,0.25);
    border:1px solid var(--border);
    padding:4px;
    border-radius:12px;
    gap:4px;
  }

  .layout-btn {
    background:transparent;
    border:none;
    color:var(--text-dim);
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    font-size:12px;
    font-weight:600;
    transition:all .2s ease;
  }

  .layout-btn:hover {
    color:var(--text);
    background:rgba(255,255,255,0.04);
  }

  .layout-btn.active {
    background:var(--accent);
    color:#fff;
  }

  .layout-btn svg {
    width:16px;
    height:16px;
    fill:currentColor;
  }

  .stats{
    color:var(--text-dim);
    font-size:13px;
    white-space:nowrap;
  }

  .categories{
    max-width:1400px;
    margin:16px auto 0;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }

  .cat-btn{
    padding:9px 18px;
    border-radius:999px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.03);
    color:var(--text-dim);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:all .2s ease;
    user-select:none;
  }

  .cat-btn:hover{
    color:var(--text);
    border-color:var(--accent-2);
    transform:translateY(-1px);
  }

  .cat-btn.active{
    background:linear-gradient(135deg, var(--accent), #2563eb);
    color:#fff;
    border-color:transparent;
    box-shadow:0 6px 16px rgba(59,130,246,0.4);
  }

  /* ---------- Grid Base ---------- */
  main{
    max-width:1400px;
    margin:0 auto;
    padding:28px 32px 60px;
  }

  .grid{
    display:grid;
    gap:22px;
    transition:all 0.3s ease;
  }

  .card{
    background:linear-gradient(180deg, var(--card), #0d1420);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    box-shadow:var(--shadow);
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    position:relative;
    overflow:hidden;
    contain:content;
  }

  .card:hover{
    transform:translateY(-4px);
    border-color:rgba(59,130,246,0.4);
    box-shadow:0 12px 30px rgba(0,0,0,0.55);
  }

  /* Шахматная сетка прозрачности на фоне */
  .viewer-box{
    width:100%;
    border-radius:12px;
    overflow:hidden;
    background-color:#1e293b;
    background-image: 
      linear-gradient(45deg, #131c2c 25%, transparent 25%), 
      linear-gradient(-45deg, #131c2c 25%, transparent 25%), 
      linear-gradient(45deg, transparent 75%, #131c2c 75%), 
      linear-gradient(-45deg, transparent 75%, #131c2c 75%);
    background-size:16px 16px;
    background-position:0 0, 0 8px, 8px -8px, -8px 0px;
    position:relative;
    border:1px solid rgba(255,255,255,0.05);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* Переключение видимости в зависимости от режима */
  .skin-flat-img {
    display:block;
    max-width:100%;
    max-height:100%;
    object-fit:contain;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    padding:10px;
    transition:transform 0.2s ease;
  }

  .skin-model-canvas {
    display:none;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,0.35));
    transition:transform 0.2s ease;
  }

  /* Эффект увеличения на наведении */
  .card:hover .viewer-box img,
  .card:hover .viewer-box canvas {
    transform:scale(1.08);
  }

  .name{
    margin-top:14px;
    font-size:14px;
    font-weight:700;
    text-align:center;
    color:var(--text);
    word-break:break-word;
    max-width:100%;
  }

  .cat-tag{
    margin-top:4px;
    font-size:11px;
    color:var(--accent-2);
    text-transform:uppercase;
    letter-spacing:0.6px;
    font-weight:700;
  }

  .actions{
    margin-top:14px;
    display:flex;
    gap:8px;
    width:100%;
  }

  .btn{
    flex:1;
    padding:9px 10px;
    border-radius:10px;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.04);
    color:var(--text);
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:all .15s ease;
  }

  .btn:hover{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  .btn.copied{
    background:#16a34a;
    border-color:#16a34a;
    color:#fff;
  }

  .btn svg{width:14px;height:14px;flex-shrink:0;}

  /* ---------- РЕЖИМ 1: СТАНДАРТНАЯ СЕТКА (Текстура) ---------- */
  .grid.layout-standard {
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
  }
  .grid.layout-standard .viewer-box {
    height:220px;
  }
  .grid.layout-standard .skin-flat-img { display:block; }
  .grid.layout-standard .skin-model-canvas { display:none; }

  /* ---------- РЕЖИМ 2: КОМПАКТНАЯ СЕТКА (Текстура) ---------- */
  .grid.layout-compact {
    grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));
    gap:12px;
  }
  .grid.layout-compact .card {
    padding:10px;
    border-radius:12px;
  }
  .grid.layout-compact .viewer-box {
    height:120px;
  }
  .grid.layout-compact .viewer-box img {
    padding:4px;
  }
  .grid.layout-compact .name {
    font-size:12px;
    margin-top:8px;
  }
  .grid.layout-compact .cat-tag {
    font-size:10px;
    margin-top:2px;
  }
  .grid.layout-compact .actions {
    margin-top:8px;
    flex-direction:column;
    gap:4px;
  }
  .grid.layout-compact .btn {
    padding:6px 4px;
    font-size:11px;
    border-radius:6px;
  }
  .grid.layout-compact .skin-flat-img { display:block; }
  .grid.layout-compact .skin-model-canvas { display:none; }

  /* ---------- РЕЖИМ 3: 3D ФОТО (Собранный скин) ---------- */
  .grid.layout-model {
    grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));
  }
  .grid.layout-model .viewer-box {
    height:250px;
  }
  .grid.layout-model .skin-flat-img { display:none; }
  .grid.layout-model .skin-model-canvas {
    display:block;
    width:auto !important;
    height:90% !important;
    aspect-ratio:16 / 32;
  }

  /* ---------- Конец стилей сеток ---------- */

  .empty-state{
    text-align:center;
    padding:80px 20px;
    color:var(--text-dim);
  }

  .empty-state h2{
    color:var(--text);
    font-size:20px;
    margin-bottom:8px;
  }

  #sentinel {
    height: 40px;
    width: 100%;
    margin-top: 20px;
  }

  footer{
    text-align:center;
    padding:24px;
    color:var(--text-dim);
    font-size:12.5px;
    border-top:1px solid var(--border);
  }

  /* ---------- Responsive ---------- */
  @media (max-width:768px){
    header{padding:16px 16px 12px;}
    main{padding:20px 16px 40px;}
    .logo{font-size:18px;}
    .search-wrap{width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="logo">
      <div class="cube"></div>
      Skins Gallery
      <span class="sub">Fast Skin Viewer</span>
    </div>

    <div class="controls-group">
      <!-- Переключатель сеток -->
      <div class="layout-switcher">
        <button class="layout-btn" data-layout="compact" title="Компактная сетка">
          <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z"/></svg>
          Компактно
        </button>
        <button class="layout-btn" data-layout="standard" title="Стандартная сетка">
          <svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zm9 0h7v7h-7zM4 13h7v7H4zm9 0h7v7h-7z"/></svg>
          Сетка
        </button>
        <button class="layout-btn" data-layout="model" title="Вид 3D Фото">
          <svg viewBox="0 0 24 24"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>
          3D Фото
        </button>
      </div>

      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input id="searchInput" type="text" placeholder="Поиск скина...">
      </div>

      <div class="stats" id="statsLabel">Загрузка...</div>
    </div>
  </div>

  <div class="categories" id="categoriesBar"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div id="sentinel"></div>
  <div class="empty-state" id="emptyState" style="display:none;">
    <h2>Ничего не найдено</h2>
    <p>Попробуйте изменить поисковый запрос или выбрать другую категорию.</p>
  </div>
</main>

<footer>
  Skins Gallery &middot; ультрабыстрый рендеринг &middot; работает на GitHub Pages
</footer>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------
  // Стейт
  // ---------------------------------------------------------------------
  let allSkins = [];             // Полный датасет
  let filteredSkins = [];        // Отфильтрованный датасет
  let displayedSkinsCount = 0;   // Сколько скинов сейчас в DOM
  const CHUNK_SIZE = 48;         // Порция скинов
  
  let activeCategory = "All";
  let searchTerm = "";
  let currentLayout = localStorage.getItem("gallery-layout") || "model"; // По умолчанию открываем "3D Фото"
  
  let sentinelObserver = null;

  const BASE_URL = new URL("images/", window.location.href).href;

  const gridEl = document.getElementById("grid");
  const categoriesBarEl = document.getElementById("categoriesBar");
  const searchInputEl = document.getElementById("searchInput");
  const statsLabelEl = document.getElementById("statsLabel");
  const emptyStateEl = document.getElementById("emptyState");
  const sentinelEl = document.getElementById("sentinel");

  // ---------------------------------------------------------------------
  // Инициализация верстки и Layout
  // ---------------------------------------------------------------------
  function initLayout() {
    document.querySelectorAll(".layout-btn").forEach(btn => {
      if (btn.dataset.layout === currentLayout) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    });
    gridEl.className = `grid layout-${currentLayout}`;

    document.querySelectorAll(".layout-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const selectedLayout = btn.dataset.layout;
        if (selectedLayout === currentLayout) return;

        currentLayout = selectedLayout;
        localStorage.setItem("gallery-layout", currentLayout);

        document.querySelectorAll(".layout-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        gridEl.className = `grid layout-${currentLayout}`;
      });
    });
  }

  // ---------------------------------------------------------------------
  // Загрузка данных
  // ---------------------------------------------------------------------
  async function loadData() {
    try {
      const res = await fetch("data.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const raw = await res.json();
      allSkins = normalizeData(raw);
    } catch (err) {
      console.error("Не удалось загрузить data.json:", err);
      allSkins = [];
      statsLabelEl.textContent = "Ошибка загрузки data.json";
    }
  }

  function normalizeData(raw) {
    if (!Array.isArray(raw)) return [];
    return raw
      .filter(item => item && typeof item.file === "string" && item.file.trim().length)
      .map((item, index) => {
        const file = item.file.replace(/^\/+/, "");
        const parts = file.split("/");
        const category = parts.length > 1 ? parts[0] : "Other";
        const filename = parts[parts.length - 1];
        return {
          id: "skin_" + index,
          file,
          category,
          filename,
          url: BASE_URL + file
        };
      });
  }

  // ---------------------------------------------------------------------
  // Алгоритмический Рендерер Скина (Flat 2D Minecraft Skin Assembler)
  // ---------------------------------------------------------------------
  function drawSkinFront(img, canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const tempCanvas = document.createElement('canvas');
    tempCanvas.width = img.naturalWidth;
    tempCanvas.height = img.naturalHeight;
    const tempCtx = tempCanvas.getContext('2d');
    tempCtx.drawImage(img, 0, 0);

    const is64x64 = img.naturalHeight === img.naturalWidth;

    // Автоопределение тонких рук Alex (3px) или классических Steve (4px)
    let isSlim = false;
    if (is64x64) {
      try {
        const armColData = tempCtx.getImageData(47, 20, 1, 12).data;
        let isAlphaZero = true;
        for (let i = 3; i < armColData.length; i += 4) {
          if (armColData[i] > 0) {
            isAlphaZero = false;
            break;
          }
        }
        isSlim = isAlphaZero;
      } catch(e) {}
    }

    const armW = isSlim ? 3 : 4;
    const rightArmX = isSlim ? 1 : 0;
    const leftArmX = 12;

    ctx.imageSmoothingEnabled = false;

    // 1. Ноги (Отрисовываем первыми)
    // Правая нога (База + Верхний слой одежды)
    ctx.drawImage(tempCanvas, 4, 20, 4, 12, 4, 20, 4, 12);
    if (is64x64) ctx.drawImage(tempCanvas, 4, 36, 4, 12, 4, 20, 4, 12);

    // Левая нога (База + Верхний слой одежды)
    if (is64x64) {
      ctx.drawImage(tempCanvas, 20, 52, 4, 12, 8, 20, 4, 12);
      ctx.drawImage(tempCanvas, 4, 52, 4, 12, 8, 20, 4, 12);
    } else {
      // Для старых 64x32 скинов просто зеркалим правую ногу
      ctx.save();
      ctx.translate(12, 20);
      ctx.scale(-1, 1);
      ctx.drawImage(tempCanvas, 4, 20, 4, 12, 0, 0, 4, 12);
      ctx.restore();
    }

    // 2. Тело/Торс (База + Верхний слой одежды)
    ctx.drawImage(tempCanvas, 20, 20, 8, 12, 4, 8, 8, 12);
    if (is64x64) ctx.drawImage(tempCanvas, 20, 36, 8, 12, 4, 8, 8, 12);

    // 3. Руки
    // Правая рука (База + Верхний слой)
    ctx.drawImage(tempCanvas, 44, 20, armW, 12, rightArmX, 8, armW, 12);
    if (is64x64) ctx.drawImage(tempCanvas, 44, 36, armW, 12, rightArmX, 8, armW, 12);

    // Левая рука (База + Верхний слой)
    if (is64x64) {
      ctx.drawImage(tempCanvas, 36, 52, armW, 12, leftArmX, 8, armW, 12);
      ctx.drawImage(tempCanvas, 52, 52, armW, 12, leftArmX, 8, armW, 12);
    } else {
      // Для старых 64x32 скинов зеркалим правую руку
      ctx.save();
      ctx.translate(leftArmX + armW, 8);
      ctx.scale(-1, 1);
      ctx.drawImage(tempCanvas, 44, 20, armW, 12, 0, 0, armW, 12);
      ctx.restore();
    }

    // 4. Голова (База + Шлем/Волосы сверху)
    ctx.drawImage(tempCanvas, 8, 8, 8, 8, 4, 0, 8, 8);
    ctx.drawImage(tempCanvas, 40, 8, 8, 8, 4, 0, 8, 8);
  }

  // ---------------------------------------------------------------------
  // Категории
  // ---------------------------------------------------------------------
  function extractCategories(skins) {
    const set = new Set();
    skins.forEach(s => set.add(s.category));
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }

  function renderCategories() {
    const categories = extractCategories(allSkins);
    categoriesBarEl.innerHTML = "";

    const makeBtn = (label) => {
      const btn = document.createElement("button");
      btn.className = "cat-btn" + (label === activeCategory ? " active" : "");
      btn.textContent = label;
      btn.addEventListener("click", () => {
        activeCategory = label;
        renderCategories();
        applyFilters();
      });
      return btn;
    };

    categoriesBarEl.appendChild(makeBtn("All"));
    categories.forEach(cat => categoriesBarEl.appendChild(makeBtn(cat)));
  }

  // ---------------------------------------------------------------------
  // Фильтрация и Бесконечный скролл
  // ---------------------------------------------------------------------
  function applyFilters() {
    filteredSkins = allSkins.filter(skin => {
      const matchesCategory = activeCategory === "All" || skin.category === activeCategory;
      const matchesSearch = !searchTerm || skin.filename.toLowerCase().includes(searchTerm);
      return matchesCategory && matchesSearch;
    });

    gridEl.innerHTML = "";
    displayedSkinsCount = 0;

    if (!filteredSkins.length) {
      emptyStateEl.style.display = "block";
      sentinelEl.style.display = "none";
      updateStats(0);
      return;
    }

    emptyStateEl.style.display = "none";
    sentinelEl.style.display = "block";
    updateStats(filteredSkins.length);

    loadMoreSkins();
    setupSentinel();
  }

  function loadMoreSkins() {
    const nextBatch = filteredSkins.slice(displayedSkinsCount, displayedSkinsCount + CHUNK_SIZE);
    if (nextBatch.length === 0) {
      sentinelEl.style.display = "none";
      return;
    }

    const fragment = document.createDocumentFragment();
    nextBatch.forEach(skin => {
      fragment.appendChild(buildCard(skin));
    });
    gridEl.appendChild(fragment);

    displayedSkinsCount += nextBatch.length;

    if (displayedSkinsCount >= filteredSkins.length) {
      sentinelEl.style.display = "none";
    }
  }

  function updateStats(count) {
    statsLabelEl.textContent = `${count} из ${allSkins.length} файлов`;
  }

  function setupSentinel() {
    if (sentinelObserver) sentinelObserver.disconnect();

    sentinelObserver = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && filteredSkins.length > displayedSkinsCount) {
        loadMoreSkins();
      }
    }, { rootMargin: "400px" });

    sentinelObserver.observe(sentinelEl);
  }

  // ---------------------------------------------------------------------
  // Генерация карточки (Быстрый плоский DOM)
  // ---------------------------------------------------------------------
  function buildCard(skin) {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.id = skin.id;

    const viewerBox = document.createElement("div");
    viewerBox.className = "viewer-box";

    // Нативная ленивая загрузка развернутой текстуры
    const img = document.createElement("img");
    img.src = skin.url;
    img.alt = skin.filename;
    img.loading = "lazy";
    img.className = "skin-flat-img";
    viewerBox.appendChild(img);

    // Легковесный нативный 16x32 холст для отображения собранного персонажа
    const canvas = document.createElement("canvas");
    canvas.width = 16;
    canvas.height = 32;
    canvas.className = "skin-model-canvas";
    viewerBox.appendChild(canvas);

    // Когда браузер загрузит текстуру (лениво, при приближении к экрану),
    // мгновенно запускаем прорисовку персонажа на canvas.
    img.onload = () => {
      drawSkinFront(img, canvas);
    };

    card.appendChild(viewerBox);

    const info = document.createElement("div");
    info.className = "card-info";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = skin.filename;
    info.appendChild(name);

    const catTag = document.createElement("div");
    catTag.className = "cat-tag";
    catTag.textContent = skin.category;
    info.appendChild(catTag);

    card.appendChild(info);

    // Панель кнопок действий
    const actions = document.createElement("div");
    actions.className = "actions";

    const copyBtn = document.createElement("button");
    copyBtn.className = "btn copy-btn";
    copyBtn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      Копировать`;
    copyBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      copyUrl(skin.url, copyBtn);
    });
    actions.appendChild(copyBtn);

    const openBtn = document.createElement("button");
    openBtn.className = "btn open-btn";
    openBtn.innerHTML = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      Открыть`;
    openBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      window.open(skin.url, "_blank", "noopener");
    });
    actions.appendChild(openBtn);

    card.appendChild(actions);

    return card;
  }

  async function copyUrl(url, btn) {
    try {
      await navigator.clipboard.writeText(url);
    } catch (err) {
      const ta = document.createElement("textarea");
      ta.value = url;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) { /* ignore */ }
      document.body.removeChild(ta);
    }

    const originalHTML = btn.innerHTML;
    btn.classList.add("copied");
    btn.textContent = "Скопировано!";
    setTimeout(() => {
      btn.classList.remove("copied");
      btn.innerHTML = originalHTML;
    }, 1200);
  }

  // ---------------------------------------------------------------------
  // Поиск (Debounce ввода)
  // ---------------------------------------------------------------------
  let searchDebounceTimer = null;
  searchInputEl.addEventListener("input", (e) => {
    clearTimeout(searchDebounceTimer);
    const value = e.target.value;
    searchDebounceTimer = setTimeout(() => {
      searchTerm = value.trim().toLowerCase();
      applyFilters();
    }, 150);
  });

  // ---------------------------------------------------------------------
  // Старт приложения
  // ---------------------------------------------------------------------
  async function init() {
    initLayout();
    await loadData();
    renderCategories();
    applyFilters();
  }

  init();
})();
</script>

</body>
</html>
