<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NuckemSkins</title>

<script>
(function(){

  "use strict";

  /*
   * GitHub Pages вызывает этот файл,
   * когда пользователь напрямую открывает:
   *
   * https://nuckem.github.io/skins/Otec
   *
   * Нам нужно сохранить "Otec",
   * вернуть пользователя в index.html,
   * а index.html уже восстановит
   * красивый URL.
   */

  const pathname =
    decodeURIComponent(
      window.location.pathname
    );

  const base =
    "/skins/";

  let route = "";

  if(
    pathname === base ||
    pathname === base.slice(0,-1)
  ){

    route = "";

  }else if(
    pathname.startsWith(base)
  ){

    route =
      pathname
        .substring(base.length)
        .replace(/^\/+/, "")
        .replace(/\/+$/, "");

  }

  /*
   * Если это неизвестный URL,
   * не пытаемся ломать навигацию.
   */

  const target =
    base +
    (
      route
        ? "?route=" +
          encodeURIComponent(route)
        : ""
    );

  /*
   * replace, а не href:
   *
   * временный ?route=... не остаётся
   * в истории браузера.
   */

  window.location.replace(
    target
  );

})();
</script>

<style>
html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#0f172a;
  color:#e5e7eb;
  font-family:
    'Segoe UI',
    Roboto,
    Arial,
    sans-serif;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
}

.loading{
  text-align:center;
}

.spinner{
  width:36px;
  height:36px;
  margin:0 auto 16px;

  border:4px solid rgba(255,255,255,.1);
  border-top-color:#3b82f6;

  border-radius:50%;

  animation:
    spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.text{
  color:#94a3b8;
  font-size:14px;
}
</style>

</head>

<body>

<div class="loading">

  <div class="spinner"></div>

  <div class="text">
    Загрузка NuckemSkins...
  </div>

</div>

</body>
</html>
